kind = "web"
previewPath = "/"
title = "ذاكرة عين فربة"
version = "1.0.0"
id = "artifacts/ain-farba"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22853

[services.development]
run = "pnpm --filter @workspace/ain-farba run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ain-farba", "run", "build" ]
publicDir = "artifacts/ain-farba/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22853"
BASE_PATH = "/"
